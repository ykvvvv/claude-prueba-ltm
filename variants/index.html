<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LTM Partners · Visor de variantes</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#08090A;color:#E8EAED;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
.bar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 14px;border-bottom:1px solid #1E2125;background:#0C0D0F}
.title{font-weight:600;letter-spacing:.02em;margin-right:auto}
.title span{color:#8A9099;font-weight:400}
.group{display:flex;border:1px solid #2A2E34;border-radius:8px;overflow:hidden}
.group button{background:none;border:0;border-right:1px solid #2A2E34;color:#8A9099;font:inherit;padding:8px 14px;cursor:pointer}
.group button:last-child{border-right:0}
.group button:hover{color:#fff}
.group button[aria-pressed="true"]{background:#E8EAED;color:#08090A;font-weight:600}
button:focus-visible,a:focus-visible{outline:2px solid #7AA7FF;outline-offset:2px}
.open{color:#8A9099;text-decoration:none;border:1px solid #2A2E34;border-radius:8px;padding:8px 12px}
.open:hover{color:#fff}
.stage{flex:1;min-height:0;display:flex;gap:1px;background:#1E2125;justify-content:center}
.pane{flex:1;min-width:0;display:none;flex-direction:column;background:#08090A}
.pane.on{display:flex}
.pane-label{flex:none;padding:6px 12px;font-size:12px;color:#8A9099;border-bottom:1px solid #1E2125;display:none}
.compare .pane-label{display:block}
.frame-wrap{flex:1;min-height:0;display:flex;justify-content:center;overflow:auto}
iframe{border:0;width:100%;height:100%;background:#000}
.mobile .frame-wrap{padding:16px 0;align-items:flex-start}
.mobile iframe{width:360px;height:780px;max-height:100%;flex:none;border:1px solid #2A2E34;border-radius:18px}
.hint{flex:none;padding:6px 14px;font-size:12px;color:#6B717A;border-top:1px solid #1E2125}
kbd{border:1px solid #2A2E34;border-radius:4px;padding:0 5px;font:inherit}
@media(max-width:900px){.compare .stage{flex-direction:column}.hint{display:none}}
</style>
</head>
<body>
<header class="bar">
  <div class="title">LTM Partners <span>· variantes de diseño</span></div>
  <div class="group" role="group" aria-label="Variante">
    <button data-v="a">A · Terminal</button>
    <button data-v="b">B · Editorial</button>
    <button data-v="c">C · Bento</button>
    <button data-v="all">Comparar</button>
  </div>
  <div class="group" role="group" aria-label="Tamaño">
    <button data-d="desktop">Escritorio</button>
    <button data-d="mobile">Móvil 360</button>
  </div>
  <a class="open" id="open" target="_blank" rel="noopener">Abrir sola ↗</a>
</header>
<main class="stage" id="stage">
  <section class="pane" data-pane="a"><div class="pane-label">A · Terminal</div><div class="frame-wrap"><iframe title="Variante A" data-src="variante-a.html"></iframe></div></section>
  <section class="pane" data-pane="b"><div class="pane-label">B · Editorial</div><div class="frame-wrap"><iframe title="Variante B" data-src="variante-b.html"></iframe></div></section>
  <section class="pane" data-pane="c"><div class="pane-label">C · Bento</div><div class="frame-wrap"><iframe title="Variante C" data-src="variante-c.html"></iframe></div></section>
</main>
<footer class="hint">Teclas: <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> variante · <kbd>4</kbd> comparar · <kbd>M</kbd> móvil/escritorio</footer>
<script>
(function(){
  var body=document.body,open=document.getElementById('open');
  var state={v:'b',d:'desktop'};
  try{var h=location.hash.slice(1).split('-');if(/^(a|b|c|all)$/.test(h[0]))state.v=h[0];if(h[1]==='mobile')state.d='mobile'}catch(e){}
  function render(){
    body.classList.toggle('compare',state.v==='all');
    body.classList.toggle('mobile',state.d==='mobile');
    [].forEach.call(document.querySelectorAll('.pane'),function(p){
      var on=state.v==='all'||p.dataset.pane===state.v;
      p.classList.toggle('on',on);
      var f=p.querySelector('iframe');
      if(on&&!f.src)f.src=f.dataset.src;   // carga cada variante solo cuando se muestra
    });
    [].forEach.call(document.querySelectorAll('[data-v]'),function(b){b.setAttribute('aria-pressed',b.dataset.v===state.v)});
    [].forEach.call(document.querySelectorAll('[data-d]'),function(b){b.setAttribute('aria-pressed',b.dataset.d===state.d)});
    open.style.display=state.v==='all'?'none':'';
    open.href='variante-'+state.v+'.html';
    try{history.replaceState(null,'','#'+state.v+(state.d==='mobile'?'-mobile':''))}catch(e){}
  }
  document.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.dataset.v)state.v=b.dataset.v;
    if(b.dataset.d)state.d=b.dataset.d;
    render();
  });
  document.addEventListener('keydown',function(e){
    var k=e.key.toLowerCase(),m={'1':'a','2':'b','3':'c','4':'all'};
    if(m[k]){state.v=m[k];render()}
    else if(k==='m'){state.d=state.d==='mobile'?'desktop':'mobile';render()}
  });
  render();
})();
</script>
</body>
</html>
